name: Add a released version

# Run by hand once savonet/liquidsoap:v<version> is on Docker Hub: sync-docs runs that image
# to generate the reference. The result is a pull request, which this workflow builds itself
# since a pull request opened with GITHUB_TOKEN does not trigger the Build workflow.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Liquidsoap release, without the leading v (e.g. 2.4.6)
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  add:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check the version
        run: |
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release version: ${VERSION}"; exit 1; }

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run sync -- --version "${VERSION}"

      - name: List it, newest first
        run: |
          jq -c --arg version "${VERSION}" \
            '. + [$version] | unique | sort_by(split(".") | map(tonumber)) | reverse' \
            versions.json > versions.json.new
          mv versions.json.new versions.json

      - run: npm run test:prism

      - name: Build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          ONLY_VERSIONS: ${{ inputs.version }}
        run: npm run build

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="add-version-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${branch}"
          git add versions.json versioned_docs versioned_sidebars static
          git commit -m "Add ${VERSION} documentation"
          git push -f origin "${branch}"
          gh pr create --title "Add ${VERSION} documentation" \
            --body "Generated by \`npm run sync -- --version ${VERSION}\`."
