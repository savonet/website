name: Deploy preview to GitHub Pages

# Publishes this repository's own Pages site. Because savonet.github.io carries the
# www.liquidsoap.info custom domain, a project page for savonet/website is served at
# https://www.liquidsoap.info/website/ -- which is why the build runs under that subpath.
#
# This is the review target, not production. Production still comes from the existing
# pipeline until the cutover, at which point the build output goes to savonet.github.io
# instead and BASE_URL becomes '/'.

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Fired by savonet/liquidsoap when main is built, carrying the run id of the workflow
  # whose doc bundle should be published as the in-development version.
  repository_dispatch:
    types: [liquidsoap-main]

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling so main always lands.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Documentation for released versions is committed under versioned_docs. Only the
      # in-development version is fetched, from the liquidsoap run that triggered this
      # build -- or, for a manual run, from the most recent successful one.
      - name: Fetch the liquidsoap doc bundle
        id: bundle
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.LIQUIDSOAP_READ_TOKEN }}
          RUN_ID: ${{ github.event.client_payload.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${RUN_ID}" ]; then
            echo "No run id in the payload; looking up the latest successful build of main."
            RUN_ID=$(gh run list -R savonet/liquidsoap -w ci.yml -b main -s success \
              -L 1 --json databaseId -q '.[0].databaseId')
          fi
          echo "Using liquidsoap run ${RUN_ID}"
          gh run download -R savonet/liquidsoap "${RUN_ID}" -n liquidsoap-doc -D bundle
          test -d bundle/content

      # A missing or not-yet-published bundle must not block a deploy: the site simply
      # builds without the in-development version, which docusaurus.config.ts allows for.
      - name: Sync the in-development version
        if: steps.bundle.outcome == 'success'
        run: npm run sync -- --version dev --bundle bundle

      - name: Report what will be published
        run: |
          if [ -d docs ] && ls docs/*.md >/dev/null 2>&1; then
            echo "dev: $(ls docs/*.md | wc -l) pages"
          else
            echo "::warning::No dev bundle; publishing released versions only."
          fi

      - name: Build
        env:
          BASE_URL: /${{ github.event.repository.name }}/
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
