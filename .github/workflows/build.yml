name: Build

# This repository never publishes. The site is built and published by savonet/liquidsoap's
# doc workflow, which is the only place the in-development version can be generated -- see
# .github/workflows/doc.yml there. Here we only prove the tree still builds.
#
# The build is also where the site's own checks run: postBuild fails if the landing page
# links to a missing page, or if the favicon or share image named in the config was never
# emitted.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run test:prism

      - name: Build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run build
